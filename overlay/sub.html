<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscriber Overlay Realtime - Gaming Edition</title>
  <!-- Gaming & Esports HUD Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sub.css">
</head>
<body>

  <!-- Outer Gaming HUD Container -->
  <div class="hud-wrapper">
    
    <!-- Cyber Corners Decorative Accents -->
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <!-- Main Gaming Card -->
    <div class="sub-card">
      
      <!-- Top HUD Header Banner -->
      <div class="hud-status-bar">
        <div class="hud-brand">
          <span class="status-pulse-dot"></span>
          <span class="hud-brand-title">STREAM STATS // LIVE TELEMETRY</span>
        </div>
        <div id="hud-badge-sync" class="hud-badge-sync is-live">
          <span id="sync-icon" class="sync-icon">⚡</span>
          <span id="sync-text" class="sync-text">Menghubungkan…</span>
        </div>
      </div>

      <!-- Main Subscriber Section -->
      <div class="sub-header">
        
        <!-- Platform Icon & Sub Count -->
        <div class="sub-main-col">
          <div class="platform-badge yt-badge" title="YouTube Channel">
            <!-- Official YouTube SVG Icon -->
            <svg class="platform-icon yt-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z" fill="#FF0000"/>
              <polygon points="9.545,15.568 15.818,12 9.545,8.432" fill="#FFFFFF"/>
            </svg>
            <div class="sub-label-wrap">
              <span class="sub-platform-name">YOUTUBE</span>
              <span id="channel-name" class="label">SUBSCRIBERS</span>
            </div>
          </div>
          <div class="sub-count-wrapper">
            <span id="sub-count" class="count">Loading...</span>
          </div>
        </div>

        <!-- Right Side: Channel Telemetry Stats -->
        <div class="channel-stats">
          
          <!-- Total Views Item -->
          <div class="stat-item cyber-stat-chip">
            <div class="stat-header">
              <svg class="stat-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <span class="stat-label">TOTAL VIEWS</span>
            </div>
            <span id="total-views" class="stat-value">Loading...</span>
          </div>

          <!-- Total Videos Item -->
          <div class="stat-item cyber-stat-chip">
            <div class="stat-header">
              <svg class="stat-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
              <span class="stat-label">VIDEOS</span>
            </div>
            <span id="total-videos" class="stat-value">Loading...</span>
          </div>

        </div>

      </div>

      <!-- Gamer XP / Sub-Goal Progress Bar -->
      <div class="sub-progress">
        <div class="progress-meta">
          <div class="progress-badge">
            <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
            <span class="meta-title">GOAL PROGRESS</span>
          </div>
          <div id="sub-percentage" class="target-info">
            0% dari 100.000
          </div>
        </div>

        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill">
            <span class="progress-bar-glow"></span>
          </div>
        </div>
      </div>

      <!-- Dual Platform Live Viewers Grid (Gaming Pods) -->
      <div class="live-viewers">
        
        <!-- YouTube Live Monitor Pod -->
        <div class="stat-item live-item yt-live-pod">
          <div class="pod-header">
            <div class="pod-platform">
              <svg class="pod-platform-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z" fill="#FF2A4D"/>
                <polygon points="9.545,15.568 15.818,12 9.545,8.432" fill="#FFFFFF"/>
              </svg>
              <span class="pod-name">YT LIVE</span>
            </div>
            <span class="pod-tag yt-tag">STREAM</span>
          </div>
          <div class="pod-body">
            <span id="yt-viewer-count" class="stat-value"><span class="live-dot"></span>Loading...</span>
          </div>
        </div>

        <!-- TikTok Live Monitor Pod -->
        <div class="stat-item live-item tt-live-pod">
          <div class="pod-header">
            <div class="pod-platform">
              <!-- Official TikTok SVG Icon (Duotone / Cyan-Magenta effect) -->
              <svg class="pod-platform-icon tt-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 0 1-2.883 2.585 2.894 2.894 0 0 1-2.89-2.894 2.895 2.895 0 0 1 2.89-2.894c.32 0 .626.054.914.153V9.083a6.324 6.324 0 0 0-.914-.067c-3.535 0-6.4 2.865-6.4 6.4 0 3.536 2.865 6.4 6.4 6.4a6.38 6.38 0 0 0 6.377-6.075V9.458a8.21 8.21 0 0 0 5.127 1.79V7.785a4.832 4.832 0 0 1-1.406-1.099z" fill="#00F2FE"/>
                <path d="M19.389 6.486a4.793 4.793 0 0 1-3.77-4.245V2h-3.045v13.672a2.896 2.896 0 0 1-2.883 2.585 2.894 2.894 0 0 1-2.89-2.894 2.895 2.895 0 0 1 2.89-2.894c.32 0 .626.054.914.153V9.083a6.324 6.324 0 0 0-.914-.067c-3.535 0-6.4 2.865-6.4 6.4 0 3.536 2.865 6.4 6.4 6.4a6.38 6.38 0 0 0 6.377-6.075V9.458a8.21 8.21 0 0 0 5.127 1.79V7.785a4.832 4.832 0 0 1-1.406-1.099z" fill="#FE2C55" style="mix-blend-mode: screen;"/>
                <path d="M19.189 6.286a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 0 1-2.883 2.585 2.894 2.894 0 0 1-2.89-2.894 2.895 2.895 0 0 1 2.89-2.894c.32 0 .626.054.914.153V9.083a6.324 6.324 0 0 0-.914-.067c-3.535 0-6.4 2.865-6.4 6.4 0 3.536 2.865 6.4 6.4 6.4a6.38 6.38 0 0 0 6.377-6.075V9.458a8.21 8.21 0 0 0 5.127 1.79V7.785a4.832 4.832 0 0 1-1.406-1.099z" fill="#FFFFFF"/>
              </svg>
              <span class="pod-name">TIKTOK</span>
            </div>
            <span class="pod-tag tt-tag">LIVE</span>
          </div>
          <div class="pod-body">
            <span id="tt-viewer-count" class="stat-value"><span class="live-dot"></span>Loading...</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="sub.js"></script>
</body>
</html>
